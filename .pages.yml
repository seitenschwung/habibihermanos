# Pages CMS (https://pagescms.org): forms for the band to add and edit gigs and photos.
# It edits public/assets/termine.json and public/assets/fotos.json (top-level arrays); saving commits to the branch
# chosen in Pages CMS, and CI deploys main after the checks (npm test runs scripts/check-termine.mjs and check-fotos.mjs).
# Uploaded photos land in public/assets/images/uploads; the Docker build shrinks them and strips their metadata.

settings:
  commit:
    identity: user
    templates:
      update: "Inhalte aktualisiert ({path})"

media:
  input: public/assets/images/uploads
  output: /assets/images/uploads
  extensions: [jpg, jpeg, png, webp]

content:
  - name: termine
    label: Termine
    description: "Auftritte für die Startseite und die Live-Seite. Vergangene Termine verschwinden automatisch."
    type: file
    path: public/assets/termine.json
    format: json
    list: true
    fields:
      - name: date
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: time
        label: Uhrzeit
        type: string
        description: "Format HH:MM, z. B. 20:00. Leer lassen, wenn sie noch nicht feststeht."
        options:
          maxlength: 5
      - name: venue
        label: Ort
        type: string
        required: true
        description: "Name des Ortes, z. B. Alma Kiel."
        options:
          maxlength: 80
      - name: label
        label: Label
        type: string
        description: "Kleine Zeile über dem Text, z. B. Konzert oder Open Air. Leer = Live."
        options:
          maxlength: 40
      - name: text
        label: Text
        type: text
        description: "Ein, zwei Sätze zum Auftritt."
      - name: tickets
        label: Ticket-Link
        type: string
        description: "Vollständige Adresse zum Ticketverkauf, z. B. https://www.eventim.de/… Erscheint als Button „Tickets buchen“. Leer = kein Button."
        options:
          maxlength: 500
  - name: fotos
    label: Fotos
    description: "Fotos für die Galerie auf der Fotos-Seite, neueste zuerst. Handyfotos einfach hochladen: sie werden beim Veröffentlichen automatisch verkleinert, und der Aufnahmeort wird entfernt."
    type: file
    path: public/assets/fotos.json
    format: json
    list: true
    fields:
      - name: image
        label: Bild
        type: image
        required: true
        description: "JPG, PNG oder WebP, höchstens 15 MB."
      - name: title
        label: Titel
        type: string
        required: true
        description: "Kurz, z. B. Bandgründung im Alma."
        options:
          maxlength: 80
      - name: date
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: text
        label: Beschreibung
        type: text
        description: "Ein, zwei Sätze zum Foto. Wird in der Großansicht gezeigt und hilft Menschen, die das Bild nicht sehen können."
        options:
          maxlength: 400
