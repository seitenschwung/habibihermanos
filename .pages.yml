# Pages CMS (https://pagescms.org): forms for the band to add and edit gigs, photos and songs.
# It edits public/assets/{termine,fotos,songs}.json (top-level arrays); saving commits to the branch chosen in Pages CMS,
# and CI deploys main after the checks (npm test runs scripts/check-{termine,fotos,songs}.mjs).
# Uploads land in public/assets/images/uploads and public/assets/media/uploads; the Docker build shrinks and
# recompresses them and strips their metadata.

settings:
  commit:
    identity: user
    templates:
      update: "Inhalte aktualisiert ({path})"

media:
  - name: images
    label: Fotos
    input: public/assets/images/uploads
    output: /assets/images/uploads
    extensions: [jpg, jpeg, png, webp]
  - name: audio
    label: Hörproben
    input: public/assets/media/uploads
    output: /assets/media/uploads
    extensions: [mp3, m4a]

content:
  - name: termine
    label: Termine
    description: "Auftritte für die Startseite und die Live-Seite. Vergangene Termine verschwinden automatisch."
    type: file
    path: public/assets/termine.json
    format: json
    list: true
    fields:
      - name: date
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: time
        label: Uhrzeit
        type: string
        description: "Format HH:MM, z. B. 20:00. Leer lassen, wenn sie noch nicht feststeht."
        options:
          maxlength: 5
      - name: venue
        label: Ort
        type: string
        required: true
        description: "Name des Ortes, z. B. Alma Kiel."
        options:
          maxlength: 80
      - name: label
        label: Label
        type: string
        description: "Kleine Zeile über dem Text, z. B. Konzert oder Open Air. Leer = Live."
        options:
          maxlength: 40
      - name: text
        label: Text
        type: text
        description: "Ein, zwei Sätze zum Auftritt."
      - name: tickets
        label: Ticket-Link
        type: string
        description: "Vollständige Adresse zum Ticketverkauf, z. B. https://www.eventim.de/… Erscheint als Button „Tickets buchen“. Leer = kein Button."
        options:
          maxlength: 500
  - name: fotos
    label: Fotos
    description: "Fotos für die Galerie auf der Fotos-Seite, neueste zuerst. Handyfotos einfach hochladen: sie werden beim Veröffentlichen automatisch verkleinert, und der Aufnahmeort wird entfernt."
    type: file
    path: public/assets/fotos.json
    format: json
    list: true
    fields:
      - name: image
        label: Bild
        type: image
        required: true
        description: "JPG, PNG oder WebP, höchstens 15 MB."
        options:
          media: images
      - name: title
        label: Titel
        type: string
        required: true
        description: "Kurz, z. B. Bandgründung im Alma."
        options:
          maxlength: 80
      - name: date
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: text
        label: Beschreibung
        type: text
        description: "Ein, zwei Sätze zum Foto. Wird in der Großansicht gezeigt und hilft Menschen, die das Bild nicht sehen können."
        options:
          maxlength: 400
  - name: songs
    label: Songs
    description: "Die Songliste auf der Musik-Seite (Repertoire). Hörproben nur für eigene Songs: Aufnahmen von Covers dürfen wir nicht ohne Lizenz veröffentlichen."
    type: file
    path: public/assets/songs.json
    format: json
    list: true
    fields:
      - name: title
        label: Titel
        type: string
        required: true
        options:
          maxlength: 80
      - name: own
        label: Eigener Song
        type: boolean
        description: "Anhaken, wenn ihr den Song selbst geschrieben habt."
      - name: artist
        label: Original von
        type: string
        description: "Nur bei Covers: Interpret oder Band des Originals. Bei Covers Pflicht."
        options:
          maxlength: 80
      - name: language
        label: Sprache
        type: select
        required: true
        options:
          values: [Spanisch, Arabisch, Deutsch, Englisch, Mehrsprachig, Instrumental]
      - name: note
        label: Notiz
        type: string
        description: "Optional, ein kurzer Satz, z. B. unsere erste eigene Nummer."
        options:
          maxlength: 140
      - name: audio
        label: Hörprobe
        type: file
        description: "Nur bei eigenen Songs. MP3 oder M4A, höchstens 20 MB; wird beim Veröffentlichen komprimiert."
        options:
          media: audio
          extensions: [mp3, m4a]
          rename: safe
