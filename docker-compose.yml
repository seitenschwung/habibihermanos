# For Coolify: Build Pack "Docker Compose", give the service "web" the domain with port 8080
# (https://<domain>:8080). Coolify handles TLS and routing.
services:
  web:
    # Coolify doesn't build: CI builds and tests the image, pushes it to ghcr.io and sets IMAGE
    # (an environment variable in Coolify) to exactly that tag before every deploy.
    image: ${IMAGE:?set by the CI deploy job}
    restart: unless-stopped
    # CrowdSec reads this container's logs through the Docker API (labels, see CLAUDE.md).
    labels:
      - crowdsec.enable=true
      - crowdsec.labels.type=nginx
    # Logs go to the host's journald, which deletes them after 14 days (host setup in README, "Log retention");
    # the privacy policy promises that period. `docker logs` and CrowdSec still read them through the Docker API.
    logging:
      driver: journald
      options:
        tag: habibi-web
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Booking mailer (POST /api/anfrage via nginx): same image, its own process, no domain and no published port.
  # Set in Coolify: SMTP_USER, SMTP_PASS (secret); the rest has defaults. Without SMTP_PASS it answers 503 and the
  # site falls back to the mail address, so deploying before configuring is safe.
  mailer:
    image: ${IMAGE:?set by the CI deploy job}
    command: ["node", "/app/mailer/server.mjs"]
    user: "101"
    restart: unless-stopped
    environment:
      SMTP_HOST: ${SMTP_HOST:-mail.your-server.de}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-booking.habibihermanos@seitenschwung.com}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-booking.habibihermanos@seitenschwung.com}
      MAIL_TO: ${MAIL_TO:-aemsez08@gmail.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://habibihermanos.de,https://www.habibihermanos.de,https://habibi.seitenschwung.com,https://www.habibi.seitenschwung.com}
    logging:
      driver: journald
      options:
        tag: habibi-mailer
    expose:
      - "3000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
